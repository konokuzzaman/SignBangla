<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignBangla</title>
<style>
@font-face { font-family: "SignBangla Bengali"; src: url(/font.ttf) format("truetype"); }
:root {
  --background: #eef1f5;
  --caption-background: #f8f9fb;
  --caption-border: #e1e5ea;
  --caption-text: #9aa3af;
  --highlight-background: #1f2937;
  --highlight-text: #ffffff;
  --caption-font-size: 40px;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--background);
  font-family: "SignBangla Bengali", sans-serif; }
#stage { position: absolute; left: 0; top: 0; right: 0; }
#stage canvas { display: block; }
#caption { position: absolute; left: 0; right: 0; bottom: 0; min-height: 96px; box-sizing: border-box;
  padding: 10px 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 30px;
  background: var(--caption-background); border-top: 1px solid var(--caption-border);
  color: var(--caption-text); font-size: var(--caption-font-size); line-height: 1.35; }
#caption span { padding: 2px 18px 6px; border-radius: 14px; }
#caption span.on { background: var(--highlight-background); color: var(--highlight-text) !important; }
#replay { position: absolute; right: 18px; bottom: 24px; width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid var(--caption-border); background: #ffffff; color: var(--highlight-background);
  font-size: 26px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#replay:hover { background: var(--caption-border); }
#replay:focus-visible { outline: 3px solid #2f80ed; outline-offset: 2px; }
#replay svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="caption"></div>
<button id="replay" type="button" aria-label="Replay">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
       stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
</button>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<script type="module" src="/studio3d.js"></script>
</body>
</html>
